[package]
name = "narwhal-application-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "narwhal_application_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = false
codegen-units = 1
panic = "unwind"
