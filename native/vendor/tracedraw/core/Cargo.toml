[package]
name = "tracedraw-core"
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Pinned TraceDraw document model used by Narwhal's CDR compatibility layer"

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
i_overlay = "9"

[features]
test-profiles = []
