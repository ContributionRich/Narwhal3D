[package]
name = "narwhal-picture-pdf"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Bounded first-page PDF rasterization for reference Pictures (not geometry import)"

[dependencies]
serde_json = "1"
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
