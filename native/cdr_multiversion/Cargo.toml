[package]
name = "narwhal-cdr-multiversion"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Isolated bundled CDR v16-v18 reader for Narwhal 3D"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tracedraw-cdr = { path = "../vendor/tracedraw/cdr" }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tracedraw-core = { path = "../vendor/tracedraw/core" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
