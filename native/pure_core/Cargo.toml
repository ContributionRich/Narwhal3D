[package]
name = "narwhal-pure-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Native acceleration core for Narwhal 3D's pure interchange and parsing modules"

[lib]
name = "narwhal_pure_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
