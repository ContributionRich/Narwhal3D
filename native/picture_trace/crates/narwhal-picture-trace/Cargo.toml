[package]
name = "narwhal-picture-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Cut lines (closed Bezier outlines with offset) around the artwork in an image, for Narwhal 3D TracePicture"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "narwhal-picture-trace"
path = "src/main.rs"

[dependencies]
narwhal-trace-core = { workspace = true }
vectorcraft-geom = { workspace = true }
vectorcraft-trace = { workspace = true }
vectorcraft-pathops = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }
