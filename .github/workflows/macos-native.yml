name: macOS ARM64 native helpers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narwhal-macos-native
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Restore native build cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/narwhal-native
          key: macos14-arm64-native-v1-${{ hashFiles('native/**/Cargo.lock', 'native/geometry_core/build.rs', 'scripts/build_macos_native.py') }}-${{ github.run_id }}
          restore-keys: |
            macos14-arm64-native-v1-${{ hashFiles('native/**/Cargo.lock', 'native/geometry_core/build.rs', 'scripts/build_macos_native.py') }}-
            macos14-arm64-native-v1-
      - name: Build and test every native component
        id: build
        run: python3 -u scripts/build_macos_native.py --work "$HOME/narwhal-native"
      - name: Preserve native compiler progress
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/narwhal-native
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Preserve executable permissions in native artifact
        if: always()
        run: |
          mkdir -p native-evidence
          if [ -d "$HOME/narwhal-native/output" ]; then
            ditto licenses "$HOME/narwhal-native/output/licenses"
            tar -C "$HOME/narwhal-native/output" -czf native-evidence/macos-native.tar.gz .
            shasum -a 256 native-evidence/macos-native.tar.gz > native-evidence/native.sha256
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-arm64-native-${{ github.run_id }}
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 14
