name: macOS bounded worker containment proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: macos-14
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile isolated native API experiment
        run: rustc --edition=2021 -O spike/macos_containment/probe.rs -o memory-proof
      - name: Prove ordinary-user limits and bounded negative controls
        shell: bash
        run: |
          set -o pipefail
          ./memory-proof 2>&1 | tee memory-proof.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-containment-proof-${{ github.run_id }}
          path: memory-proof.log
          if-no-files-found: warn
          retention-days: 14
