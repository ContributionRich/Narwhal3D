name: macOS ARM64 patched runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narwhal-macos-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: macos-14
    timeout-minutes: 350
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install cmake ninja git-lfs
          git lfs install
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Check patched presentation in OpenGL and Metal-only builds
        run: python3 -B scripts/test_present_backends.py
      - name: Restore exact runtime inputs and compiler cache
        id: runtime-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/narwhal-runtime
          key: macos14-arm64-xcode162-runtime-v2-${{ hashFiles('blender_patches/**', 'scripts/build_macos_runtime.py') }}-${{ github.run_id }}
          restore-keys: |
            macos14-arm64-xcode162-runtime-v2-${{ hashFiles('blender_patches/**', 'scripts/build_macos_runtime.py') }}-
            macos14-arm64-xcode162-runtime-v2-
      - name: Build all six patches with native artwork
        id: build
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 -u scripts/build_macos_runtime.py --work "$HOME/narwhal-runtime" --jobs 2 \
            > runtime-evidence/build.log 2>&1
      - name: Preserve compiler progress even after a failed build
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/narwhal-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Archive runtime without losing executable bits or symlinks
        run: |
          set -euo pipefail
          tar -C "$HOME/narwhal-runtime/install" -czf runtime-evidence/macos-arm64-runtime.tar.gz .
          shasum -a 256 runtime-evidence/macos-arm64-runtime.tar.gz > runtime-evidence/runtime.sha256
          git --no-pager rev-parse HEAD > runtime-evidence/source.txt
      - name: Retain runtime and diagnostics (not a release package)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-runtime-${{ github.run_id }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 14
