name: macOS 0.4.8 app and DMG qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact audited public Mac source commit
        required: true
      runtime_run:
        description: Verified patched runtime artifact run
        required: true
        default: '41012973989'

permissions:
  contents: read
  actions: read

concurrency:
  group: narwhal-macos-native
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 75
    env:

      MACOSX_DEPLOYMENT_TARGET: '14.0'
      SOURCE_REF: ${{ inputs.source_ref }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Check frozen source and install compiler
        run: |
          test "$(git --no-pager rev-parse HEAD)" = "$SOURCE_REF"
          test "$(uname -m)" = arm64
          rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-arm64-runtime-${{ inputs.runtime_run }}
          run-id: ${{ inputs.runtime_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime-input
      - name: Verify and extract the existing runtime, without rebuilding Blender
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=root/'runtime-input/macos-arm64-runtime.tar.gz'
          with archive.open('rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()=='ecd99134f65141343461223565b8b2fce752df83e1210fd7c42fbb5bb08f1023'
          target=root/'narwhal-runtime'; target.mkdir()
          with tarfile.open(archive) as t: t.extractall(target,filter='data')
          PY
      - name: Restore preserved native compiler cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/narwhal-native
          key: macos14-arm64-native-v1-${{ hashFiles('native/**/Cargo.lock', 'native/geometry_core/build.rs', 'scripts/build_macos_native.py') }}-${{ github.run_id }}
          restore-keys: |
            macos14-arm64-native-v1-${{ hashFiles('native/**/Cargo.lock', 'native/geometry_core/build.rs', 'scripts/build_macos_native.py') }}-
            macos14-arm64-native-v1-
      - name: Build and test current native inputs
        id: native
        run: python3 -u scripts/build_macos_native.py --work "$HOME/narwhal-native"
      - name: Preserve compiler progress
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/narwhal-native
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Assemble, sign ad-hoc and verify the real DMG
        run: |
          mkdir -p "$RUNNER_TEMP/mac-evidence"
          set -o pipefail
          python3 -u scripts/assemble_macos_release.py --source "$GITHUB_WORKSPACE" --source-revision "$SOURCE_REF" --version 0.4.8 --runtime "$RUNNER_TEMP/narwhal-runtime" --native "$HOME/narwhal-native/output" --output "$RUNNER_TEMP/mac-package" 2>&1 | tee "$RUNNER_TEMP/mac-evidence/assembly.log"
      - name: Qualify actual DMG geometry and native UI after relocation
        run: |
          set -o pipefail
          python3 -u scripts/accept_macos_release.py --dmg "$RUNNER_TEMP/mac-package/Narwhal_3D-0.4.8-macOS-arm64.dmg" --source "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/mac-acceptance" 2>&1 | tee "$RUNNER_TEMP/mac-evidence/acceptance.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-048-candidate-${{ github.run_id }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/mac-package/*.dmg
            ${{ runner.temp }}/mac-package/*.sha256
            ${{ runner.temp }}/mac-package/*.build.json
            ${{ runner.temp }}/mac-evidence/
            ${{ runner.temp }}/mac-acceptance/*.log
            ${{ runner.temp }}/mac-acceptance/results.json
            ~/narwhal-native/output/*.log
            ~/narwhal-native/output/native-build.json
            ~/narwhal-native/output/native-failures.json
          if-no-files-found: warn
          retention-days: 14
