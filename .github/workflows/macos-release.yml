name: macOS native release preflight

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact public source commit to test
        required: true
        default: '58506732456af52150087da1a9d3c2f2f224b1df'

permissions:
  contents: read

concurrency:
  group: narwhal-macos-release
  cancel-in-progress: false

jobs:
  native-preflight:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Validate requested source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$(uname -m)" == arm64 ]] || exit 2

      - name: Check out exact public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          submodules: false

      - name: Record native environment without personal data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-evidence
          git --no-pager rev-parse HEAD > preflight-evidence/source.txt
          test "$(cat preflight-evidence/source.txt)" = "$SOURCE_REF"
          uname -m > preflight-evidence/architecture.txt
          sw_vers > preflight-evidence/os.txt
          xcodebuild -version > preflight-evidence/xcode.txt
          xcrun --sdk macosx --show-sdk-version > preflight-evidence/sdk.txt
          df -h . > preflight-evidence/disk.txt
          sysctl -n hw.memsize > preflight-evidence/memory.txt

      - name: Install pinned Rust compiler
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Run native ARM64 core tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/narwhal-native-preflight"
          cargo +1.95.0 test --manifest-path native/pure_core/Cargo.toml --locked --jobs 2 \
            > preflight-evidence/core-tests.log 2>&1
          cargo +1.95.0 rustc --manifest-path native/pure_core/Cargo.toml --release --lib --locked --jobs 2 \
            -- -C link-arg=-Wl,-install_name,@rpath/libnarwhal_pure_core.dylib \
            > preflight-evidence/core-build.log 2>&1
          LIB="$CARGO_TARGET_DIR/release/libnarwhal_pure_core.dylib"
          file "$LIB" > preflight-evidence/library-format.txt
          otool -L "$LIB" > preflight-evidence/library-dependencies.txt
          otool -l "$LIB" > preflight-evidence/library-load-commands.txt
          shasum -a 256 "$LIB" > preflight-evidence/library.sha256
          printf '%s\n' 'Native-core preflight only. Not a complete app, DMG, GUI or Gatekeeper qualification.' \
            > preflight-evidence/BOUNDARY.txt

      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-preflight-${{ github.run_id }}
          path: preflight-evidence/
          if-no-files-found: error
          retention-days: 7
