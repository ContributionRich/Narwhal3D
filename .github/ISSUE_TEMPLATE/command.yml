name: Command implementation
description: Propose or implement one focused Narwhal 3D command
title: "[Command] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep this issue scoped to one command. Unsupported behavior must be reported explicitly; never substitute a different command or faceted manufacturing geometry.
  - type: input
    id: command
    attributes:
      label: Command name
      placeholder: HideSwap
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Expected command-line workflow
      description: List prompts, selections, options, completion, and cancellation behavior.
    validations:
      required: true
  - type: textarea
    id: geometry
    attributes:
      label: Geometry and document impact
      description: State whether the command changes selection, view state, document geometry, layers, or Undo history.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Acceptance tests
      description: Include success, invalid-input, Undo/Redo, and mutation-test cases that apply.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Contributing to this issue

        - New computation, parsing, selection, projection, and coordination, and their computational tests, must be implemented in Rust under `native/`.
        - New Python is allowed only for necessary host/UI/ctypes integration that Rust cannot reasonably reach, with the concrete API constraint named.
        - Do not add a duplicate Python fallback or silently replay a legacy algorithm.
        - Full policy: [CONTRIBUTING.md](https://github.com/ContributionRich/Narwhal3D/blob/main/CONTRIBUTING.md)

        Bug reporters do not need to write code or provide an implementation; a clear, reproducible description is enough.
